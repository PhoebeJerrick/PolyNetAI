# 批量任务配置文件（供 ./record.sh mstart 使用）
#
# 格式（每行一个任务，字段之间用空格或 Tab 分隔）：
#   类型  周期数  [config路径]  [output_dir]  [starting_cash]  [per_cycle_cash]  [data_stream_dir]
#
# 类型字段：
#   replay  模拟下单测试：从已录制的周期目录回放，立刻开始，无需等待
#           data_stream_dir = --input-dir，即已录制周期目录的父目录
#           默认数据流路径: artifacts/live/record_job
#
#   live    实盘验证：连接 Polymarket 实盘行情，需等下一个 5m 周期边界才开始
#           data_stream_dir = --record-events-dir，即实盘事件的保存路径
#           默认数据流路径: artifacts/live/record_job/record_job_market
#           需要 API 配置（由脚本默认读 ../APIs/ApiConfig.env）
#
# 兼容旧格式：若第一列为纯数字（无类型字段），自动按 replay 处理
#
# 规则：
#   - 以 # 开头的行为注释，空行自动忽略
#   - 未指定的字段填 - 表示使用默认值
#   - config          默认: configs/strategy.yaml
#   - output_dir      默认: 自动生成 artifacts/live/batch_jobs/<时间戳>_<序号>_<类型>
#   - starting_cash   默认: 200
#   - per_cycle_cash  默认: 无（不固定每周期资金）
#   - data_stream_dir 默认: 见上方类型说明
#
# ── 示例 ──────────────────────────────────────────────────────────────────────
# 类型    周期  config                    output_dir                                      cash  per  data_stream_dir
# ─────────────────────────────────────────────────────────────────────────────
# 说明：
# 1) mstart 每次会按“未注释行”启动任务；可保留多组模板，用注释开关。
# 2) 是否生成 Excel 报表由环境变量独立控制：
#    - RECORD_INCLUDE_PERFORMANCE_REPORT=1：生成 sim_batch_replay_performance_report*.xlsx（中等耗时）
#    - RECORD_INCLUDE_TRADE_PROCESS=1：生成 batch_replay_trade_process_zh*.xlsx（最重）
#      注意：交易过程 Excel 依赖绩效报告流程；仅开 trade-process 时会自动补开 performance-report
#    - 两者都为 0（默认）：不生成以上两类 Excel（最快）
#
# 建议档位（同一份数据流 artifacts/live/record_job）：
#
# A. 极速档（仅核心回放 + CSV/HTML，最快，适合频繁调参）
replay    18   configs/strategy.yaml     artifacts/live/batch_jobs/preset_fast_18            200  100  artifacts/live/record_job
#
# B. 平衡档（周期更多，仍不出 Excel，适合稳定性回归）
# replay    36   configs/strategy.yaml     artifacts/live/batch_jobs/preset_balanced_36        200  100  artifacts/live/record_job
#
# C. 完整报告档（需要 Excel 汇总与交易过程；启动前先 export RECORD_INCLUDE_PERFORMANCE_REPORT=1 且 export RECORD_INCLUDE_TRADE_PROCESS=1）
# replay    18   configs/strategy.yaml     artifacts/live/batch_jobs/preset_full_report_18     200  100  artifacts/live/record_job
#
# D. 大样本压力档（长周期压测；建议默认不出 Excel）
# replay    72   configs/strategy.yaml     artifacts/live/batch_jobs/preset_stress_72          200  100  artifacts/live/record_job
#
# E. strategy_update 对照档（与 strategy.yaml 对比）
# replay    18   configs/strategy_update.yaml artifacts/live/batch_jobs/preset_update_18      200  100  artifacts/live/record_job
#live      2    configs/strategy.yaml     artifacts/live/batch_jobs/job_live_3302347_2       200  100  artifacts/live/record_job/202603302347

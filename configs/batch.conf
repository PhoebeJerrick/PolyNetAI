# 批量实盘验证任务配置文件（供 ./record.sh mstart 使用）
#
# 格式（每行一个任务，字段之间用空格或 Tab 分隔）：
#   周期数  [config路径]  [output_dir]  [starting_cash]  [per_cycle_cash]  [data_stream_dir]
#
# 规则：
#   - 以 # 开头的行为注释，空行自动忽略
#   - 未指定的字段填 - 表示使用默认值
#   - config        默认: configs/strategy.yaml
#   - output_dir    默认: 自动生成 artifacts/live/batch_jobs/<时间戳>_<序号>
#   - starting_cash 默认: 100
#   - per_cycle_cash 默认: 无（不固定每周期资金）
#   - data_stream_dir 默认: artifacts/live/record_job/record_job_market
#
# 示例（每任务指定不同数据流路径）：
#   任务1：72个周期，strategy_old.yaml，起始200，每周期100，数据流A
#   任务2：20个周期，默认配置，起始200，每周期100，数据流B
#
2  configs/strategy_old.yaml  artifacts/live/batch_jobs/job_old_72      200  100  artifacts/live/record_job_market
2  configs/strategy_old.yaml  artifacts/live/batch_jobs/job_default_20  200  100  artifacts/live/record_job

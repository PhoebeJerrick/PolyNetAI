# 批量任务配置文件（供 ./record.sh mstart 使用）
#
# 格式（每行一个任务，字段之间用空格或 Tab 分隔）：
#   类型  周期数  [config路径]  [output_dir]  [starting_cash]  [per_cycle_cash]  [data_stream_dir]
#
# 类型字段：
#   replay  模拟下单测试：从已录制的周期目录回放，立刻开始，无需等待
#           data_stream_dir = --input-dir，即已录制周期目录的父目录
#           默认数据流路径: artifacts/live/record_job
#
#   live    实盘验证：连接 Polymarket 实盘行情，需等下一个 5m 周期边界才开始
#           data_stream_dir = --record-events-dir，即实盘事件的保存路径
#           默认数据流路径: artifacts/live/record_job/record_job_market
#           需要 API 配置（由脚本默认读 ../APIs/ApiConfig.env）
#
# 兼容旧格式：若第一列为纯数字（无类型字段），自动按 replay 处理
#
# 规则：
#   - 以 # 开头的行为注释，空行自动忽略
#   - 未指定的字段填 - 表示使用默认值
#   - config          默认: configs/strategy.yaml
#   - output_dir      默认: 自动生成 artifacts/live/batch_jobs/<时间戳>_<序号>_<类型>
#   - starting_cash   默认: 100
#   - per_cycle_cash  默认: 无（不固定每周期资金）
#   - data_stream_dir 默认: 见上方类型说明
#
# ── 示例 ──────────────────────────────────────────────────────────────────────
# 类型    周期  config                    output_dir                                      cash  per  data_stream_dir
# ─────────────────────────────────────────────────────────────────────────────
replay    4   configs/strategy.yaml     artifacts/live/batch_jobs/job_replay5_4   200  100  artifacts/live/record_job/Only3Orders
#live      2    configs/strategy.yaml     artifacts/live/batch_jobs/job_live_3302347_2       200  100  artifacts/live/record_job/202603302347

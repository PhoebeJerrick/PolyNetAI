cycle:
  cycle_seconds: 300
  last_minute_seconds: 30
position:
  max_position_value: 85.0           # 目标总仓位价值（USDT）
dynamic_priority:
  # 阶段性动态优先级调整参数（A+C联合方案 — 方案C）
  phase_1_position_threshold: 0.65   # 第一阶段仓位 < 此值时提升加仓优先级
  phase_1_boost: 15                  # 优先级提升幅度
  phase_2_position_threshold: 0.50   # 第二阶段仓位 > 此值时提升减仓优先级
  phase_2_boost: 15
  phase_3_position_threshold: 0.85   # 第三阶段仓位 < 此值时提升加仓优先级
  phase_3_trend_boost: 25            # 趋势加仓优先级提升幅度
  phase_3_grid_boost: 15             # 网格加仓优先级提升幅度
opening_entry:
  enabled: true
  window_seconds: 30
  min_market_trades: 1
  vwap_epsilon: 0.01
  range_low_fraction: 0.35
  min_range_width: 0.02
  infer_missing_with_binary_complement: true
order_sizing:
  # 兼容旧版键：base_order_size/min_order_size/max_order_size/volatility_order_scale
  buy:
    base_order_size: 5.0
    min_order_size: 5.0
    max_order_size: 45.0
    volatility_order_scale: 5
  sell:
    min_order_size: 5.0
    max_order_size: 45.0
    # 仅当可卖剩余仓位本身低于最小下单量时，允许低于最小值强制平仓
    allow_close_below_min_order_size: true
capital:
  max_cash_utilization: 0.85
  min_cash_buffer: 12.0
exposure:
  max_abs_exposure_value: 40.0
  hedge_trigger_value: 12.0
  hedge_scale: 0.05
  max_grid_net_position: 10
  max_strategy_trades_per_cycle: 40
trend:
  min_trend_strength: 0.5
  trend_price_edge: 0.03
  trend_scale: 0.05
  max_trend_order_size: 80.0
grid:
  grid_low_percentile: 0.25
  grid_high_percentile: 0.75
  grid_exit_fraction: 0.25
  # 周期剩余时间（秒）<= 该值时禁用网格买卖；不配置则仅受 is_last_minute 等对入场的限制
  disable_within_seconds_before_end: 50
mean_reversion:
  enabled: true
  up_buy_deviation: 0.1
  down_buy_deviation: 0.1
  mean_reversion_sell_up_deviation: 0.2
  mean_reversion_sell_down_deviation: 0.2
  mean_reversion_sell_fraction: 0.40
  deviation_scale: 45
  # 周期剩余时间（秒）<= 该值时禁用均值回归买卖（80 即最后一分 20 秒起停止）
  disable_within_seconds_before_end: 80
profit_taking:
  take_profit_up_deviation: 0.2
  take_profit_down_deviation: 0.2
  take_profit_fraction: 0.3
stop_loss:
  # 阶段性止损阈值（A+C联合方案）
  phase_1_stop_loss_pct: 0.03      # 第一阶段（0-70s）：3%，建仓阶段需要容忍更大波动
  phase_2_stop_loss_pct: 0.02      # 第二阶段（70-160s）：2%，已有仓位需要保护利润
  phase_3_stop_loss_pct: 0.025     # 第三阶段（160-240s）：2.5%，加仓阶段需要一定容忍度
  phase_4_stop_loss_pct: 0.015     # 第四阶段（240-290s）：1.5%，临近结束快速止损

  # 高波动止损（全阶段统一）
  high_vol_stop_loss_pct: 0.01     # 高波动时1%止损

  # 周期累计止损（全阶段统一）
  stop_loss_cycle_loss: 18.0
  stop_loss_fraction: 0.5

  # 兼容旧版配置（如果未配置阶段性阈值，使用此默认值）
  stop_loss_pct: 0.02
last_minute:
  last_minute_min_confidence: 0.9
  tail_profit_scale: 0.35
  tail_volatility_scale: 14
  max_tail_exposure: 25.0
  # 浮盈较多一侧份额需 >= 另一侧 * ratio；1.0 表示不启用。平局时按 up/down 市价较高者为「优势侧」。
  preferred_leg_min_ratio: 1.2
  # A+C联合方案：第四阶段方向确认参数
  direction_ratio_threshold: 1.5         # 优势侧仓位价值 ≥ 另一侧 × 此值
  pnl_ratio_threshold: 2.0              # 优势侧浮盈 > 劣势侧浮盈 × 此值
  min_trend_strength_for_direction: 0.6  # 趋势强度 ≥ 此值才确认方向
  conservative_max_exposure: 10.0        # 无法确认方向时的保守最大敞口
execution:
  fee_rate: 0.002
  slippage_bps: 5
  min_seconds_between_orders: 2.0
  min_same_outcome_price_move_ratio: 0.03

# 【新增】每日风险管理参数
daily_limits:
  daily_loss_limit: 50.0          # 单日亏损限制：$50
  daily_loss_pause_trading: true  # 达到每日限额时暂停交易
  warning_threshold_ratio: 0.7    # 达到限额70%时警告
  market_limits:
    # 优先使用 orderbook.min_order_size 作为市场硬约束；无该字段时回退 fallback
    use_orderbook_min_order_size: true
    fallback_min_order_size: 5.0
    # 卖单也按市场最小下单量约束（建议保持 true，避免实盘拒单）
    enforce_sell_min_order_size: true
# 各买入/卖出规则单独喂价：间隔内沿用上次刷新时的「最近价」；0 表示每 tick 用最新价（与旧行为一致）
rule_price_feed:
  last_minute: 4
  entries:
    opening: 4
    hedge: 4
    grid: 4
    mean_reversion: 4
    trend: 4
  exits:
    stop_loss: 4
    hedge: 4
    take_profit: 4
    grid: 4
    mean_reversion: 4
priorities:
  risk: 10
  last_minute: 20
  stop_loss: 30
  hedge: 40
  take_profit: 50
  opening: 52
  grid: 60
  mean_reversion: 70
  trend: 80

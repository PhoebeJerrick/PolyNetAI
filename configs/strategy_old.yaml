cycle:
  cycle_seconds: 300
  last_minute_seconds: 30
opening_entry:
  enabled: true
  window_seconds: 30
  min_market_trades: 1
  vwap_epsilon: 0.01
  range_low_fraction: 0.35
  min_range_width: 0.02
  infer_missing_with_binary_complement: true
order_sizing:
  # 兼容旧版键：base_order_size/min_order_size/max_order_size/volatility_order_scale
  buy:
    base_order_size: 5.0
    min_order_size: 5.0
    max_order_size: 65.0  # 增加至65；原为45
    volatility_order_scale: 5
  sell:
    min_order_size: 5.0
    max_order_size: 45.0
    # 仅当可卖剩余仓位本身低于最小下单量时，允许低于最小值强制平仓
    allow_close_below_min_order_size: true
capital:
  max_cash_utilization: 0.95
  min_cash_buffer: 25.0
exposure:
  max_abs_exposure_value: 80.0  # 增加至80；原为40；允许更大的敞口
  hedge_trigger_value: 45.0    # 优化：从60.0降低至45.0；更主动的对冲
  hedge_scale: 0.05
  max_grid_net_position: 15    # 优化：从20降低至15；更激进的平仓，降低风险
  max_strategy_trades_per_cycle: 40
trend:
  min_trend_strength: 0.5
  trend_price_edge: 0.03
  trend_scale: 0.05
  max_trend_order_size: 80.0
grid:
  grid_low_percentile: 0.45
  grid_high_percentile: 0.95
  grid_exit_fraction: 0.25
  # 周期剩余时间（秒）<= 该值时禁用网格买卖；不配置则仅受 is_last_minute 等对入场的限制
  disable_within_seconds_before_end: 50
mean_reversion:
  enabled: true
  up_buy_deviation: 0.15       # 优化：从0.1扩大至0.15；提升敏感度
  down_buy_deviation: 0.15     # 优化：从0.1扩大至0.15；提升敏感度
  mean_reversion_sell_up_deviation: 0.2
  mean_reversion_sell_down_deviation: 0.2
  mean_reversion_sell_fraction: 0.40
  deviation_scale: 50          # 优化：从45增加至50；强化信号
  # 周期剩余时间（秒）<= 该值时禁用均值回归买卖（80 即最后一分 20 秒起停止）
  disable_within_seconds_before_end: 80
profit_taking:
  take_profit_up_deviation: 0.2   # 优化：从0.2降低至0.15；提升执行敏感度
  take_profit_down_deviation: 0.2 # 优化：从0.2降低至0.15；提升执行敏感度
  take_profit_fraction: 0.2
stop_loss:
  stop_loss_cycle_loss: 8.0       # 优化：从8.0降低至6.0；更激进的周期止损
  stop_loss_fraction: 0.5
  stop_loss_pct: 0.02             # 新增：亏损2%立即止损；原为0.05
  high_vol_stop_loss_pct: 0.01   # 新增：高波动时1%止损
last_minute:
  last_minute_min_confidence: 0.87
  tail_profit_scale: 0.35
  tail_volatility_scale: 14
  max_tail_exposure: 25.0
  # 浮盈较多一侧份额需 >= 另一侧 * ratio；1.0 表示不启用。平局时按 up/down 市价较高者为「优势侧」。
  preferred_leg_min_ratio: 1.2
execution:
  fee_rate: 0.002
  slippage_bps: 5
  min_seconds_between_orders: 4.0  # 优化：从4.5降低至2.0，提升执行率（预期从0.97%升至5-10%）
  min_same_outcome_price_move_ratio: 0.03  # Phase2优化：从0.03(3%)降低至0.01(1%)，解决价格波动瓶颈

# 【新增】每日风险管理参数
daily_limits:
  daily_loss_limit: 50.0          # 单日亏损限制：$50
  daily_loss_pause_trading: true  # 达到每日限额时暂停交易
  warning_threshold_ratio: 0.7    # 达到限额70%时警告
  market_limits:
    # 优先使用 orderbook.min_order_size 作为市场硬约束；无该字段时回退 fallback
    use_orderbook_min_order_size: true
    fallback_min_order_size: 5.0
    # 卖单也按市场最小下单量约束（建议保持 true，避免实盘拒单）
    enforce_sell_min_order_size: true
# 各买入/卖出规则单独喂价：间隔内沿用上次刷新时的「最近价」；0 表示每 tick 用最新价（与旧行为一致）
rule_price_feed:
  last_minute: 4
  entries:
    opening: 4
    hedge: 2
    grid: 2
    mean_reversion: 2
    trend: 2
  exits:
    stop_loss: 4
    hedge: 3
    take_profit: 2
    grid: 4
    mean_reversion: 4
priorities:
  risk: 10
  last_minute: 18         # Phase2优化：从15恢复至18（原为20）；重振尾盘机会捕获
  take_profit: 35         # 优化：从40降低至35；提升执行频率
  hedge: 50               # 优化：从35增加至50；更主动的对冲
  opening: 48             # 保持略低：保留慎重的入场策略
  stop_loss: 82           # Phase2优化：从80提升至82；改善止损效率
  trend: 65               # 保持
  grid: 60                # 优化：从70降低至60；降低网格优先级，让其他规则有更多机会
  mean_reversion: 70      # 优化：从75降低至70；均衡对待均值回归
